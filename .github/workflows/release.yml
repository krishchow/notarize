name: Release

# Manual only (Actions → Release → Run workflow, or `gh workflow run release.yml -f version=0.2.1`).
# Releases both artifacts of this repo in one run:
#   1. the npm package `notarize-mcp` (the MCP server, run with `npx -y notarize-mcp`);
#   2. the Claude Code plugin (marketplace = this repo's main branch; skill + `npx -y notarize-mcp@X`).
# Order: bump + check → commit + tag vX → push the tag → npm publish → push main → GitHub Release.
# main (what plugin users get) moves last, so the plugin never pins a version npm doesn't have.
#
# Auth: the NPM_TOKEN secret (npm granular access token with publish rights; "bypass 2FA" on).
# Leave NPM_TOKEN unset to use npm trusted publishing (OIDC) instead — see docs/releasing.md.
# Re-running with the same version resumes from the pushed tag (publish and/or push main).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.1 (use the current package.json version to publish it without a bump)"
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag"
        type: choice
        options: [latest, next]
        default: latest
      dry_run:
        description: "Dry run: build + check + npm publish --dry-run; push and publish nothing"
        type: boolean
        default: false

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit + tag, create the GitHub Release
      id-token: write # npm provenance / trusted publishing
    env:
      VERSION: ${{ inputs.version }}
      NPM_DIST_TAG: ${{ inputs.npm_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      PACKAGE: notarize-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Guards
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be semver like 0.2.1 (got '$VERSION')"; exit 1
          fi
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Real releases run from main (this run is on $GITHUB_REF). Use dry_run on other branches."; exit 1
          fi
          on_npm=false
          on_main=false
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then on_npm=true; fi
          mode=new
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # A previous run pushed the tag: resume from it instead of bumping again.
            if git merge-base --is-ancestor "v$VERSION" HEAD; then on_main=true; fi
            if $on_npm && $on_main; then
              echo "::error::v$VERSION is already released (on npm and on main). Pick a new version."; exit 1
            fi
            echo "Resuming release v$VERSION from its tag (on npm: $on_npm, on main: $on_main)."
            git checkout -q "v$VERSION"
            mode=resume
          elif $on_npm; then
            echo "::error::$PACKAGE@$VERSION is already on npm but tag v$VERSION doesn't exist. Pick a new version."; exit 1
          fi
          {
            echo "MODE=$mode"
            echo "ON_NPM=$on_npm"
            echo "ON_MAIN=$on_main"
            echo "CURRENT=$(node -p 'require("./package.json").version')"
          } >> "$GITHUB_ENV"

      - name: Install
        run: |
          npm install -g npm@^11.5.1  # trusted publishing needs npm >= 11.5.1
          pnpm install --frozen-lockfile

      - name: Bump version
        if: env.MODE == 'new' && env.CURRENT != inputs.version
        run: |
          node scripts/bump-version.mjs "$VERSION"
          pnpm install --lockfile-only --ignore-scripts

      - name: Build and check
        run: |
          pnpm run check  # lint, typecheck, build, tests
          {
            echo "### $PACKAGE@$VERSION"
            echo '```'
            npm pack --dry-run --ignore-scripts 2>&1 | grep -E "name:|version:|package size|unpacked size|total files"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and push the tag
        if: inputs.dry_run == false && env.MODE == 'new'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .claude-plugin/plugin.json
          if ! git diff --cached --quiet; then git commit -m "Release v$VERSION"; fi
          git tag "v$VERSION"
          git push origin "v$VERSION"  # the tag alone doesn't change what plugin users get

      - name: Publish to npm
        if: env.ON_NPM != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          set -euo pipefail
          args=(--access public --tag "$NPM_DIST_TAG" --ignore-scripts)  # checks already ran above
          if [[ "$PROVENANCE" == "true" ]]; then args+=(--provenance); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN not set — using npm trusted publishing (OIDC)."
            unset NODE_AUTH_TOKEN
          fi
          npm publish "${args[@]}"

      - name: Push main (updates the Claude Code plugin)
        if: inputs.dry_run == false && env.ON_MAIN != 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main || {
            echo "::error::Published to npm, but main could not be fast-forwarded to v$VERSION (did main move, or is it protected?). Merge tag v$VERSION into main, or re-run this workflow with the same version."
            exit 1
          }

      - name: GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --verify-tag --generate-notes --title "v$VERSION" \
                 $([[ "$NPM_DIST_TAG" == "next" ]] && echo --prerelease)
          {
            echo
            echo "Published: https://www.npmjs.com/package/$PACKAGE/v/$VERSION"
            echo
            echo 'MCP server (any client): `npx -y notarize-mcp`'
            echo 'Claude Code plugin: `/plugin marketplace add krishchow/notarize` then `/plugin install notarize@notarize`'
          } >> "$GITHUB_STEP_SUMMARY"
