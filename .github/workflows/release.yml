name: Release

# Releases are driven by Changesets (https://github.com/changesets/action). See docs/releasing.md.
#   1. PRs add `.changeset/*.md` files (`pnpm changeset`).
#   2. When they land on main, this workflow opens or updates the "Version Packages" PR. That PR bumps
#      package.json and CHANGELOG.md. It leaves the plugin pin alone.
#   3. Merging that PR publishes notarize-mcp to npm, then tags vX and creates the GitHub Release.
#   4. sync-plugin then pins .claude-plugin/plugin.json to notarize-mcp@X and pushes that to main.
#      The marketplace reads main, so the plugin never pins a version npm doesn't have yet.
#
# Runs only when a push to main touches .changeset/ or package.json (Actions minutes are scarce),
# or when started by hand from Actions → Release. A manual re-run also finishes a sync-plugin that failed.
#
# Auth: npm trusted publishing (OIDC) by default. Set the NPM_TOKEN secret to publish with a token instead.
on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "package.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: notarize-mcp

jobs:
  select-mode:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Select Changesets mode (version / publish / none)
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the version bump to the changeset-release/main branch
      pull-requests: write # open / update the Version Packages PR
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Git identity (`changeset version` commits, see "commit" in .changeset/config.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Open or update the Version Packages PR
        uses: changesets/action/version@v2.1.2
        with:
          # `changeset version` only. The plugin pin is left alone: it moves only after npm has
          # the version (sync-plugin below).
          script: pnpm run version-packages

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the vX tag and create the GitHub Release
      id-token: write # npm trusted publishing / provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc
            echo "Publishing with the NPM_TOKEN secret."
          else
            echo "NPM_TOKEN not set — using npm trusted publishing (OIDC)."
          fi
      - name: Publish to npm, tag and create the GitHub Release
        id: publish
        uses: changesets/action/publish@v2.1.2
        env:
          # `changeset publish` runs `pnpm publish`, whose prepublishOnly runs `pnpm run check`
          # (lint, typecheck, build, tests) before anything is uploaded.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
          pnpm_config_provenance: ${{ github.event.repository.private && 'false' || 'true' }}
      - name: Summary
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          {
            echo "Published: $PUBLISHED"
            echo
            echo 'MCP server (any client): `npx -y notarize-mcp`'
            echo 'Claude Code plugin: `/plugin marketplace add krishchow/notarize` then `/plugin install notarize@notarize`'
          } >> "$GITHUB_STEP_SUMMARY"

  # Pins the Claude Code plugin to the package.json version once npm has it. Runs on every Release run,
  # so it also finishes an earlier run whose push to main failed. Prereleases are left out: plugin users
  # follow main and stay on the latest stable version.
  sync-plugin:
    needs: [select-mode, publish]
    if: always() && needs.select-mode.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the plugin pin to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin the plugin to the published version
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          plugin=$(node -p 'require("./.claude-plugin/plugin.json").version')
          if [[ "$version" == "$plugin" ]]; then echo "Plugin already pins $PACKAGE@$version."; exit 0; fi
          if [[ "$version" == *-* ]]; then echo "$version is a prerelease; plugin stays on $plugin."; exit 0; fi
          if [[ "$(npm view "$PACKAGE@$version" version 2>/dev/null)" != "$version" ]]; then
            echo "$PACKAGE@$version is not on npm yet; plugin stays on $plugin."; exit 0
          fi
          node scripts/bump-version.mjs "$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/plugin.json
          git commit -m "Pin the Claude Code plugin to $PACKAGE@$version"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "Plugin now pins $PACKAGE@$version."; exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::$PACKAGE@$version is on npm, but main could not be updated (is it protected?). Re-run this workflow, or run 'node scripts/bump-version.mjs $version' and push to main."
          exit 1
